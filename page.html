<!doctype html>
<html lang="de" data-theme="lol">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LoL Shards – WebUI</title>

<style id="cssBase">
  /* ---------- Basis-Layout (gilt für beide Designs) ---------- */
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; }
  body { font-family:"Segoe UI",Roboto,Arial,sans-serif; color:var(--text); background:var(--bg);
         display:flex; flex-direction:column; }
  header { position:sticky; top:0; z-index:20; display:flex; flex-direction:column; align-items:center;
           gap:12px; padding:14px 18px; }
  header .brand { display:flex; flex-direction:column; align-items:center; gap:5px; }
  header h1 { margin:20px 0 0; font-size:32px; line-height:1; }
  header .brand .sub { font-size:18px; color:var(--muted); font-weight:600; }
  @keyframes titleSheen { 0% { background-position: 0% center; } 100% { background-position: 220% center; } }
  .essline { display:flex; gap:20px; align-items:baseline; margin-bottom:4em; }
  .ess { display:flex; gap:7px; align-items:baseline; font-variant-numeric:tabular-nums; font-size:15px;
         color:var(--muted); }
  .ess b { color:var(--loot); }
  .ess .lbl { text-transform:uppercase; letter-spacing:1px; font-size:10px; }
  .ess.orange b { color:var(--orange); }
  .toolbar { position:absolute; top:12px; left:18px; display:flex; flex-direction:column;
             gap:4px; align-items:flex-start; }
  .controls { display:contents; }
  .themes { position:absolute; top:12px; right:18px; }
  .themes { display:flex; align-items:center; gap:8px; }
  .sw-lbl { font-size:11px; text-transform:uppercase; letter-spacing:1px; color:var(--muted); }
  .sw-lbl.active { color:var(--accent); font-weight:700; }
  .switch { position:relative; display:inline-block; width:44px; height:24px; flex:none; }
  .switch input { display:none; }
  .switch .slider { position:absolute; inset:0; background:#39465f; border-radius:12px;
                    cursor:pointer; transition:background .2s; }
  .switch .slider::before { content:""; position:absolute; width:18px; height:18px; left:3px; top:3px;
                            background:#fff; border-radius:50%; transition:transform .2s; }
  .switch input:checked + .slider { background:#3c7c73; }
  .switch input:checked + .slider::before { transform:translateX(20px); }
  button { cursor:pointer; font-family:inherit; }
  button:disabled { opacity:.45; cursor:not-allowed; }
  main { padding:14px 18px 90px; }
  .bar { position:sticky; top:56px; z-index:10; display:flex; gap:10px; align-items:center; flex-wrap:wrap;
         padding:10px 14px; margin-bottom:16px; }
  .bar .info { font-size:13px; color:var(--muted); }
  .bar .info b { color:var(--text); }
  input[type=search], select { padding:7px 10px; font-size:13px; color:var(--text); }
  input.sel-all { margin:0; vertical-align:middle; }
  .tblwrap { overflow-x:auto; }
  table { width:100%; min-width:560px; border-collapse:collapse; }
  #groups { display:grid; grid-template-columns:repeat(auto-fit,minmax(560px,1fr)); gap:14px; align-items:start; }
  .group { margin:0; overflow:hidden; background:var(--panel); }
  .group h2 { font-size:13px; margin:0; padding:9px 14px; display:flex; justify-content:space-between;
              text-transform:uppercase; letter-spacing:1px; }
  .group h2 span b { color:var(--text); }
  th, td { text-align:left; padding:6px 9px; font-size:13px; vertical-align:middle; white-space:nowrap; }
  th { font-size:11px; text-transform:uppercase; letter-spacing:1px; font-weight:600; white-space:nowrap; }
  th.sortable { cursor: pointer; user-select:none; }
  th.sortable:hover { color: var(--accent); }
  th.sorted { color: var(--accent); }
  td.c-name { max-width:150px; overflow:hidden; text-overflow:ellipsis; }
  tr.selected td { }
  img.tile { width:52px; height:52px; object-fit:cover; display:block; }
  td.num { text-align:right; font-variant-numeric:tabular-nums; }
  th.num { text-align:right; }
  .chip { font-size:11px; padding:2px 8px; white-space:nowrap; }
  .own { margin-left:8px; font-weight:800; cursor:default; }
  .own.yes { color:var(--green); }
  .own.no { color:var(--orange); }
  .act { white-space:nowrap; text-align:right; }
  .act-b { display:inline-flex; gap:6px; justify-content:flex-end; align-items:center; }
  .act button { padding:4px 9px; font-size:11px; white-space:nowrap; }
  #log { margin-top:10px; display:flex; flex-direction:column; gap:4px; font-size:13px; }
  #log div { padding:6px 10px; border-left:4px solid var(--line); }
  #status { font-size:12px; color:var(--muted); display:flex; align-items:center; gap:6px; }
  #status .dot { width:9px; height:9px; border-radius:50%; background:var(--red); display:inline-block; }
  #status.on .dot { background:var(--green); }
  .muted { color:var(--muted); }
</style>

<style id="cssLol">
  /* ---------- Design 1: LoL-Client-Stil ---------- */
  html[data-theme="lol"] {
    --bg:#0a0f1c; --panel:#0f1626; --panel2:#0b1322; --line:#1f2c47;
    --text:#dfe8f5; --muted:#8fa3c3; --accent:#0ac8b9; --green:#0ac8b9;
    --red:#e84057; --loot:#c8aa6e; --orange:#fb923c;
    --display:"Georgia","Palatino Linotype","Times New Roman",serif;
  }
  html[data-theme="lol"] body {
    background: radial-gradient(1300px 640px at 50% -12%, #172642 0%, #0a0f1c 55%);
  }
  html[data-theme="lol"] header {
    background: linear-gradient(180deg, rgba(10,15,28,.97), rgba(10,15,28,.9));
    border-bottom: 2px solid var(--loot);
    box-shadow: 0 1px 0 rgba(200,170,110,.25), 0 4px 18px rgba(0,0,0,.5);
  }
  html[data-theme="lol"] header h1 {
    font-family: var(--display); text-transform: uppercase; letter-spacing: 3px; font-weight: 700;
    font-size: 56px;
    background: linear-gradient(110deg, #a8843f 0%, #d9b878 20%, #fbeebe 40%, #fff8e2 48%,
                  #fbeebe 56%, #d9b878 75%, #a8843f 100%);
    background-size: 220% auto;
    -webkit-background-clip: text; background-clip: text;
    color: transparent; -webkit-text-fill-color: transparent;
    filter: drop-shadow(0 3px 2px rgba(0,0,0,.7)) drop-shadow(0 0 16px rgba(200,170,110,.55));
    animation: titleSheen 5s linear infinite;
  }
  html[data-theme="lol"] .group {
    background: var(--panel); border: 1px solid var(--line); border-radius: 3px;
    box-shadow: 0 1px 0 rgba(200,170,110,.08) inset, 0 8px 24px rgba(0,0,0,.35);
  }
  html[data-theme="lol"] .group h2 { background: var(--panel2); color: var(--loot); border-bottom: 1px solid var(--line); }
  html[data-theme="lol"] .bar {
    background: var(--panel); border: 1px solid var(--line); border-radius: 3px;
    box-shadow: 0 1px 0 rgba(200,170,110,.08) inset;
  }
  html[data-theme="lol"] th { color: var(--loot); border-bottom: 1px solid var(--line); }
  html[data-theme="lol"] td { border-bottom: 1px solid rgba(31,44,71,.6); }
  html[data-theme="lol"] tr:last-child td { border-bottom: none; }
  html[data-theme="lol"] tr.selected td { background: rgba(200,170,110,.16); }
  html[data-theme="lol"] tr.selected td:first-child { box-shadow: inset 3px 0 0 var(--loot); }
  html[data-theme="lol"] tbody tr:hover td { background: rgba(10,200,185,.04); }
  html[data-theme="lol"] button {
    font-size: 13px; text-transform: uppercase; letter-spacing: .5px;
    color: var(--text); background: linear-gradient(180deg, #22304f 0%, #16213a 100%);
    border: 1px solid #2b3a5a; border-radius: 3px; padding: 7px 12px;
    box-shadow: 0 1px 0 rgba(255,255,255,.08) inset, 0 -1px 0 rgba(0,0,0,.4) inset;
  }
  html[data-theme="lol"] button:hover { border-color: var(--loot); color: #f5e9c8; }
  html[data-theme="lol"] button:active { transform: translateY(1px); box-shadow: 0 -1px 0 rgba(255,255,255,.06) inset, 0 1px 0 rgba(0,0,0,.5) inset; }
  html[data-theme="lol"] button.red { color: #ffd7dd; background: linear-gradient(180deg, #5c1d29, #401420); border-color: #7a2a38; }
  html[data-theme="lol"] button.red:hover { border-color: var(--red); }
  html[data-theme="lol"] button.green { color: #c9f4ef; background: linear-gradient(180deg, #0e4a44, #0a3532); border-color: #136558; }
  html[data-theme="lol"] button.green:hover { border-color: var(--green); }
  html[data-theme="lol"] input[type=search], html[data-theme="lol"] select { background: #0c1526; border: 1px solid #243454; border-radius: 3px; }
  html[data-theme="lol"] input[type=search]:focus { outline: none; border-color: var(--loot); }
  html[data-theme="lol"] input[type=checkbox] { accent-color: var(--loot); width: 15px; height: 15px; }
  html[data-theme="lol"] img.tile { border: 1px solid #243454; border-radius: 2px; box-shadow: 0 2px 8px rgba(0,0,0,.5); }
  html[data-theme="lol"] .chip { border: 1px solid var(--line); border-radius: 2px; color: var(--muted); background: var(--panel2); }
  html[data-theme="lol"] .chip.x { color: var(--loot); border-color: rgba(200,170,110,.5); }
  html[data-theme="lol"] #log div { background: var(--panel); }
  html[data-theme="lol"] #log .ok { border-color: var(--green); color: #c9f4ef; }
  html[data-theme="lol"] #log .err { border-color: var(--red); color: #ffd7dd; }
  html[data-theme="lol"] .themes { border-color: #243454; }
  html[data-theme="lol"] .themes button.active { background: var(--loot); color: #0a0f1c; }
  html[data-theme="lol"] #status .dot { box-shadow: 0 0 6px rgba(255,255,255,.15); }
</style>

<style id="cssArcade">
  /* ---------- Design 2: Retro/Arcade ---------- */
  html[data-theme="arcade"] {
    --bg:#07070c; --panel:#0c0c14; --panel2:#0a0a10; --line:#1d1d2b;
    --text:#b9f7c4; --muted:#57a86b; --accent:#39ff14; --green:#39ff14;
    --red:#ff3559; --loot:#00f0ff; --orange:#ffb000;
  }
  html[data-theme="arcade"] body {
    font-family: "Consolas","Courier New",monospace;
    text-transform: uppercase; background: #07070c;
  }
  html[data-theme="arcade"] body::before {  /* CRT-Scanlines */
    content:""; position: fixed; inset:0; pointer-events:none; z-index:9999;
    background: repeating-linear-gradient(0deg, rgba(2,12,4,.25) 0, rgba(2,12,4,.25) 1px, transparent 1px, transparent 3px);
  }
  html[data-theme="arcade"] header { background: #0a0a10; border-bottom: 2px solid var(--green);
    box-shadow: 0 0 20px rgba(57,255,20,.25) inset; }
  html[data-theme="arcade"] header h1 {
    font-size: 60px; letter-spacing: 3px; font-weight: 900;
    font-family: "Consolas","Courier New",monospace;
    background: linear-gradient(110deg, #1f8a0e 0%, #39ff14 35%, #c8ffc0 48%, #39ff14 62%, #1f8a0e 100%);
    background-size: 220% auto;
    -webkit-background-clip: text; background-clip: text;
    color: transparent; -webkit-text-fill-color: transparent;
    filter: drop-shadow(0 0 6px rgba(57,255,20,.9)) drop-shadow(0 0 22px rgba(57,255,20,.45));
    animation: titleSheen 2.8s linear infinite, arcadeFlicker 4.5s linear infinite;
  }
  @keyframes arcadeFlicker {
    0%, 100% { opacity: 1; } 90% { opacity: 1; } 91.5% { opacity: .35; }
    93% { opacity: 1; } 96% { opacity: .6; } 97.5% { opacity: 1; }
  }
  html[data-theme="arcade"] .group { background: var(--panel); border: 2px solid var(--line);
    box-shadow: 0 0 0 1px rgba(57,255,20,.15), 0 0 14px rgba(57,255,20,.06) inset; }
  html[data-theme="arcade"] table { min-width:640px; }
  html[data-theme="arcade"] td.c-name { max-width:130px; }
  html[data-theme="arcade"] .group h2 { background: #0a0a10; color: var(--green); border-bottom: 1px dashed #23332a; }
  html[data-theme="arcade"] .bar { background: #0a0a10; border: 2px solid var(--line);
    box-shadow: 0 0 10px rgba(57,255,20,.12) inset; }
  html[data-theme="arcade"] th { color: var(--green); border-bottom: 2px solid #244a30; letter-spacing: 2px; }
  html[data-theme="arcade"] td { border-bottom: 1px dashed #18261e; }
  html[data-theme="arcade"] tr:last-child td { border-bottom: none; }
  html[data-theme="arcade"] tr.selected td { background: rgba(0,240,255,.10); }
  html[data-theme="arcade"] tr.selected td:first-child { box-shadow: inset 3px 0 0 var(--accent); }
  html[data-theme="arcade"] tbody tr:hover td { background: rgba(57,255,20,.05); }
  html[data-theme="arcade"] button {
    font-family: "Consolas","Courier New",monospace; font-size: 12px; font-weight: 700;
    text-transform: uppercase; letter-spacing: 1px; color: var(--text);
    background: #0f0f18; border: 2px solid #2a2a3a; border-bottom: 4px solid #1a1a26;
    padding: 6px 12px; box-shadow: 0 3px 0 rgba(0,0,0,.5), 0 0 8px rgba(0,0,0,.4);
  }
  html[data-theme="arcade"] button:hover { border-color: var(--accent); color: var(--accent);
    text-shadow: 0 0 6px rgba(57,255,20,.8); }
  html[data-theme="arcade"] button:active { transform: translateY(2px); border-bottom-width: 2px; }
  html[data-theme="arcade"] button.red { color: var(--red); border-color: #3a1520; border-bottom-color: #2a0d16; }
  html[data-theme="arcade"] button.red:hover { border-color: var(--red); color: #ffd7dd; text-shadow: 0 0 6px rgba(255,53,89,.8); }
  html[data-theme="arcade"] button.green { color: var(--green); border-color: #15302a; border-bottom-color: #0c221c; }
  html[data-theme="arcade"] button.green:hover { text-shadow: 0 0 6px rgba(57,255,20,.9); }
  html[data-theme="arcade"] input[type=search] { background: #080810; border: 2px solid #232333;
    font-family: "Consolas",monospace; }
  html[data-theme="arcade"] input[type=search]:focus { outline: none; border-color: var(--green);
    box-shadow: 0 0 8px rgba(57,255,20,.4); }
  html[data-theme="arcade"] input[type=checkbox] { accent-color: var(--accent); width: 15px; height: 15px; }
  html[data-theme="arcade"] img.tile { border: 2px solid #1e2b26; }
  html[data-theme="arcade"] .chip { border: 1px solid #23332a; color: var(--muted); }
  html[data-theme="arcade"] .chip.x { color: var(--green); border-color: var(--green); text-shadow: 0 0 6px rgba(57,255,20,.6); }
  html[data-theme="arcade"] #log div { background: #0a0a12; }
  html[data-theme="arcade"] #log .ok { border-color: var(--green); color: var(--green); }
  html[data-theme="arcade"] #log .err { border-color: var(--red); color: var(--red); }
  html[data-theme="arcade"] .sw-lbl.active { color: var(--green); text-shadow: 0 0 6px rgba(57,255,20,.8); }
  html[data-theme="arcade"] .switch .slider { background: #1a2230; border: 1px solid #23333d; }
  html[data-theme="arcade"] .switch input:checked + .slider { background: #0f3a2e; border-color: var(--green);
    box-shadow: 0 0 8px rgba(57,255,20,.4); }
  html[data-theme="arcade"] #status .dot { box-shadow: 0 0 8px var(--red); }
  html[data-theme="arcade"] #status.on .dot { box-shadow: 0 0 10px var(--green); }
  html[data-theme="arcade"] .sub { letter-spacing: 1px; }
</style>
</head>
<body data-theme="lol">
<header>
  <div class="brand">
    <h1>LoL Shards</h1>
    <span class="sub" id="summoner">…</span>
    <div class="essline">
      <span class="ess"><span class="lbl">Blau</span> <b id="blue">–</b></span>
      <span class="ess orange"><span class="lbl">Orange</span> <b id="orange">–</b></span>
    </div>
  </div>
  <div class="controls">
    <div class="themes">
      <span class="sw-lbl" id="swLol">LoL-Stil</span>
      <label class="switch" title="Design umschalten"><input type="checkbox" id="thToggle"><span class="slider"></span></label>
      <span class="sw-lbl" id="swArc">Arcade</span>
    </div>
    <div class="toolbar">
      <span id="status">Status</span>
      <label class="sub"><input type="checkbox" id="autorefresh" checked> Auto-Refresh</label>
    </div>
  </div>
</header>
<main>
  <div class="bar">
    <input type="search" id="search" placeholder="Suchen …" style="width:220px">
    <select id="ownFilter" title="Champion-Filter (Besitz)">
      <option value="all">Champs: Alle</option>
      <option value="missing">Nur fehlende</option>
      <option value="owned">Nur besessen</option>
    </select>
    <span class="info" id="selinfo">0 ausgewählt</span>
    <button id="btnDisenchantSel" class="red">Ausgewählte entzaubern</button>
    <button id="btnUpgradeSel" class="green">Ausgewählte aktivieren</button>
    <button id="btnDuplicates" class="red" title="Entzaubert bei jeder Menge größer als 1 alle Shards bis auf einen">Doppelte entfernen</button>
  </div>
  <div id="groups"></div>
  <div id="log"></div>
</main>
<script>
"use strict";
let state = { championShards: [], skinShards: [], wardShards: [], essence: { blue:0, orange:0 } };
let selected = new Set();
let busy = false;
let sortKey = null, sortDir = 1;
let ownFilter = "all";

const $ = s => document.querySelector(s);
const el = (tag, cls, text) => { const e = document.createElement(tag);
  if (cls) e.className = cls; if (text) e.textContent = text; return e; };
const fmt = n => n.toLocaleString("de-DE");

/* ---------- Design-Umschaltung ---------- */
function applyTheme(name) {
  const lol = name === "lol";
  document.documentElement.dataset.theme = lol ? "lol" : "arcade";
  document.getElementById("cssLol").disabled = !lol;
  document.getElementById("cssArcade").disabled = lol;
  document.getElementById("thToggle").checked = !lol;
  document.getElementById("swLol").classList.toggle("active", lol);
  document.getElementById("swArc").classList.toggle("active", !lol);
  try { localStorage.setItem("lolshard_theme", name); } catch (e) {}
}
function currentTheme() {
  try {
    const q = new URLSearchParams(location.search).get("theme");
    if (q === "lol" || q === "arcade") return q;
    const saved = localStorage.getItem("lolshard_theme");
    if (saved === "lol" || saved === "arcade") return saved;
  } catch (e) {}
  return "lol";
}
applyTheme(currentTheme());
document.getElementById("thToggle").addEventListener("change", e =>
  applyTheme(e.target.checked ? "arcade" : "lol"));

async function api(path, opts) {
  const r = await fetch(path, opts);
  const j = await r.json().catch(() => ({}));
  if (!r.ok && !j.ok) throw new Error(j.error || j.message || ("HTTP " + r.status));
  return j;
}

function sortRows(rows) {
  if (!sortKey) return rows;
  const dir = sortDir, arr = rows.slice();
  arr.sort((a, b) => {
    if (sortKey === "name") {
      const x = (a.name || "").toLowerCase(), y = (b.name || "").toLowerCase();
      return x < y ? -dir : (x > y ? dir : 0);
    }
    const map = { count: a.count, disenchant: a.disenchantTotal, upgrade: a.upgradeTotal };
    const x = map[sortKey] || 0, y = { count: b.count, disenchant: b.disenchantTotal, upgrade: b.upgradeTotal }[sortKey] || 0;
    return (x - y) * dir;
  });
  return arr;
}

function makeHead() {
  const head = el("tr");
  head.innerHTML = `<th style="width:34px"><input type="checkbox" class="sel-all" title="Alle der gelisteten Einträge auswählen/abwählen"></th>`
      + `<th style="width:66px"></th><th></th><th></th><th class="num"></th><th class="num"></th><th></th>`;
  const labels = [null, null, "Name", "Anzahl", "Entzaubern", "Aktivieren", null];
  const keys = [null, null, "name", "count", "disenchant", "upgrade", null];
  const ths = head.children;
  for (let i = 2; i <= 5; i++) {
    const t = ths[i];
    t.classList.add("sortable"); t.textContent = labels[i];
    if (sortKey === keys[i]) {
      t.classList.add("sorted");
      t.textContent += sortDir > 0 ? " ▲" : " △";
    }
    t.addEventListener("click", () => {
      if (sortKey === keys[i]) sortDir = -sortDir; else { sortKey = keys[i]; sortDir = 1; }
      render();
    });
  }
  return head;
}

function render() {
  const ess = state.essence || { blue:0, orange:0 };
  $("#blue").textContent = fmt(ess.blue || 0);
  $("#orange").textContent = fmt(ess.orange || 0);
  const sum = state.summoner || {};
  $("#summoner").textContent = (sum.gameName ? sum.gameName + "#" + (sum.tagLine||"") : "…")
      + " · Stufe " + (sum.summonerLevel || "–");
  const q = ($("#search").value || "").toLowerCase();
  const wrap = $("#groups"); wrap.innerHTML = "";

  const groups = [
    { title: "Champion-Shards", rows: state.championShards || [], type: "champions" },
    { title: "Skin-Shards", rows: state.skinShards || [], type: "skins" },
    { title: "Augen-Shards", rows: state.wardShards || [], type: "wards" },
  ].filter(g => (g.rows || []).length > 0);
  for (const g of groups) {
    let rows = g.rows.filter(r => (r.name||"").toLowerCase().includes(q) || r.lootId.toLowerCase().includes(q));
    if (g.type === "champions" && ownFilter !== "all")
      rows = rows.filter(r => ownFilter === "owned" ? r.owned : !r.owned);
    rows = sortRows(rows);
    const div = el("div", "group");
    const h = el("h2"); h.appendChild(document.createTextNode(g.title + " "));
    const sp = el("span"); sp.innerHTML = "<b>" + rows.length + "</b> Einträge";
    h.appendChild(sp); div.appendChild(h);
    const table = el("table");
    const thead = el("thead"); thead.appendChild(makeHead());
    table.appendChild(thead);
    const tbody = el("tbody");
    for (const r of rows) {
      const tr = el("tr");
      if (selected.has(r.lootId)) tr.classList.add("selected");
      const c1 = document.createElement("td");
      const cb = document.createElement("input");
      cb.type = "checkbox"; cb.checked = selected.has(r.lootId);
      cb.addEventListener("change", () => {
        selected.has(r.lootId) ? selected.delete(r.lootId) : selected.add(r.lootId);
        tr.classList.toggle("selected", selected.has(r.lootId));
        updateSelInfo();
        syncSelAll(table, tbody);
      });
      c1.appendChild(cb);
      const c2 = el("td");
      const img = el("img", "tile"); img.src = "/api/img?p=" + encodeURIComponent(r.tile || "");
      img.alt = ""; c2.appendChild(img);
      const c3 = el("td"); c3.classList.add("c-name");
      c3.textContent = r.name; c3.title = r.name;
      if (r.kind === "champion") {
        const badge = el("span", "own " + (r.owned ? "yes" : "no"), r.owned ? "✓" : "✗");
        badge.title = r.owned ? "Champion bereits besessen" : "Champion noch nicht besessen";
        c3.appendChild(badge);
      }
      const c4 = el("td");
      const chip = el("span", "chip x"); chip.textContent = "× " + r.count; c4.appendChild(chip);
      const c5 = el("td", "num"); c5.title = fmt(r.disenchantValue) + " pro Shard × " + r.count;
      c5.innerHTML = "<span style='color:var(--loot);font-weight:600'>+" + fmt(r.disenchantTotal || 0) + "</span>";
      const c6 = el("td", "num");
      if (r.canUpgrade) {
        c6.title = fmt(r.upgradeCost) + " pro Shard × " + r.count;
        c6.innerHTML = "−<span style='color:var(--loot);font-weight:600'>" + fmt(r.upgradeTotal) + "</span>";
      } else c6.textContent = "–";
      const c7 = el("td"); c7.className = "act";
      const aWrap = el("span", "act-b");
      const bDis = el("button", "red", "Entzaubern");
      bDis.addEventListener("click", () => doAction([{ lootId:r.lootId, name:r.name, action:"disenchant", count:1 }]));
      const bUp = el("button", "green", "Aktivieren");
      bUp.disabled = !r.canUpgrade;
      bUp.addEventListener("click", () => doAction([{ lootId:r.lootId, name:r.name, action:"upgrade", count:1 }]));
      aWrap.append(bDis, bUp);
      c7.appendChild(aWrap);
      tr.append(c1, c2, c3, c4, c5, c6, c7);
      tbody.appendChild(tr);
    }
    table.appendChild(tbody);
    const selAll = table.querySelector(".sel-all");
    if (selAll) {
      selAll.addEventListener("change", () => {
        const on = selAll.checked;
        for (const r of rows) { on ? selected.add(r.lootId) : selected.delete(r.lootId); }
        tbody.querySelectorAll("tr").forEach(tr => tr.classList.toggle("selected", on));
        tbody.querySelectorAll("input[type=checkbox]").forEach(cb => cb.checked = on);
        updateSelInfo();
        syncSelAll(table, tbody);
      });
    }
    syncSelAll(table, tbody);
    const twrap = el("div", "tblwrap");
    twrap.appendChild(table);
    div.appendChild(twrap);
    wrap.appendChild(div);
  }
  updateSelInfo();
}

function syncSelAll(table, tbody) {
  const selAll = table && table.querySelector(".sel-all");
  if (!selAll) return;
  const cbs = tbody ? tbody.querySelectorAll("input[type=checkbox]") : [];
  const on = [...cbs].filter(c => c.checked).length;
  selAll.checked = on > 0 && on === cbs.length;
  selAll.indeterminate = on > 0 && on < cbs.length;
}

function updateSelInfo() {
  let dsum = 0, usum = 0, cnt = 0;
  const all = [...(state.championShards||[]), ...(state.skinShards||[]), ...(state.wardShards||[])];
  for (const r of all) {
    if (selected.has(r.lootId)) {
      cnt++;
      dsum += r.disenchantValue;
      if (r.canUpgrade) usum += r.upgradeCost;
    }
  }
  $("#selinfo").innerHTML = "<b>" + cnt + "</b> Einträge gewählt (je 1 Shard) · "
      + "Entzaubern: <b style='color:var(--loot)'>+" + fmt(dsum) + "</b> · "
      + "Aktivieren: <b style='color:var(--loot)'>−" + fmt(usum) + "</b>";
}

const EMPTY_STATE = { championShards: [], skinShards: [], wardShards: [], essence: { blue:0, orange:0 } };

function setStatus(on, msg) {
  const st = $("#status");
  st.className = on ? "on" : "";
  st.innerHTML = "<span class='dot'></span> " + msg;
}

async function loadLoot() {
  try {
    const j = await api("/api/loot");
    if (!j.ok || !Array.isArray(j.championShards)) {
      state = Object.assign({}, EMPTY_STATE);
      render();
      setStatus(false, "Verbindung fehlgeschlagen: " + (j.error || "Unbekannter Fehler"));
      return;
    }
    state = j;
    selected = new Set([...selected].filter(id =>
      j.championShards.some(x=>x.lootId===id) || j.skinShards.some(x=>x.lootId===id)
      || j.wardShards.some(x=>x.lootId===id)));
    render();
    setStatus(true, "Verbunden · " + new Date().toLocaleTimeString("de-DE"));
  } catch (e) {
    state = Object.assign({}, EMPTY_STATE);
    render();
    setStatus(false, "Verbindung fehlgeschlagen: " + e.message);
  }
}

function log(ok, msg) {
  const d = el("div", ok ? "ok" : "err", msg);
  $("#log").prepend(d);
  while ($("#log").children.length > 120) $("#log").lastChild.remove();
}

function collectSelected(action) {
  const all = [...(state.championShards||[]), ...(state.skinShards||[]), ...(state.wardShards||[])];
  return all.filter(r => selected.has(r.lootId)).map(r => ({
    lootId: r.lootId, name: r.name, action, count: 1 }));
}

function collectDuplicates() {
  return [...(state.championShards||[]), ...(state.skinShards||[]), ...(state.wardShards||[])]
    .filter(r => r.count > 1)
    .map(r => ({ lootId: r.lootId, name: r.name, action: "disenchant", count: r.count - 1 }));
}

async function doAction(actions) {
  if (busy) return;
  const verb = actions[0].action === "disenchant" ? "entzaubern" : "aktivieren";
  const n = actions.reduce((s,a)=>s+a.count,0);
  const label = actions.length + (actions.length === 1 ? " Eintrag" : " Einträge") + " (" + n + (n === 1 ? " Shard" : " Shards") + ")";
  if (!confirm(label + " " + verb + "? Dies kann nicht rückgängig gemacht werden."))
    return;
  busy = true; document.body.style.cursor = "progress";
  try {
    const j = await api("/api/craft", { method:"POST", headers:{ "Content-Type":"application/json" },
      body: JSON.stringify({ actions }) });
    if (!j.ok) {
      log(false, "Fehler: " + (j.error || "Unbekannter Fehler"));
    } else {
      for (const r of j.results) log(r.ok, (r.ok ? "✔ " : "✘ ") + (r.name||"") + (r.count>1? " ×"+r.count:"") + " — " + r.message);
    }
  } catch (e) {
    log(false, "Fehler: " + e.message);
  } finally {
    busy = false; document.body.style.cursor = "";
    await loadLoot();
  }
}

$("#search").addEventListener("input", render);
$("#ownFilter").addEventListener("change", e => { ownFilter = e.target.value; render(); });
$("#btnDisenchantSel").addEventListener("click", () => doAction(collectSelected("disenchant")));
$("#btnUpgradeSel").addEventListener("click", () => doAction(collectSelected("upgrade")));
$("#btnDuplicates").addEventListener("click", () => {
  const ds = collectDuplicates();
  if (!ds.length) { alert("Keine Shards mit Menge > 1 vorhanden."); return; }
  doAction(ds);
});

/* Echtzeit-Updates: SSE-Stream, ersetzt das 6s-Polling. Fallback-Poll nur,
   wenn der Stream nicht verbunden ist. */
let sseOk = false;
try {
  const evt = new EventSource("/api/stream");
  evt.addEventListener("loot", () => {
    if (!sseOk || !$("#autorefresh").checked || busy) return;
    loadLoot();
  });
  evt.onopen = () => { sseOk = true; loadLoot(); };
  evt.onerror = () => { sseOk = false; };
} catch (e) {}
setInterval(() => { if (!sseOk && $("#autorefresh").checked && !busy) loadLoot(); }, 8000);
loadLoot();
</script>
</body>
</html>
